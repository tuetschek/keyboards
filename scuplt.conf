045e:07a4

include shared

[main]
# F1-F4: swap with media keys
playpause = f1
mute = f2
volumedown = f3
volumeup = f4
f1 = playpause
f2 = mute
f3 = volumedown
f4 = volumeup

# F5-F12: turn the keyboard's shortcut chords into real F-keys

# Win+F21 -> F8
[meta]
f21 = f8

# Shift+Win+F21 -> F5
[meta+shift]
f21 = f5

# Alt+Win+F21 -> F6, Alt+Win+F22 -> F11
[meta+alt]
f21 = f6
f22 = f11

# Ctrl+Win+F21 -> F7, +Backspace -> F9, +Tab -> F10, +F23 -> F12
[control+meta]
f21 = f7
backspace = f9
tab = f10
f23 = f12
